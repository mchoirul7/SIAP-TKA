<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 176" width="460" height="176">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffe0b8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e35ff"/>
      <stop offset="1" stop-color="#5b0fd6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
  </defs>
  <rect width="460" height="176" fill="url(#bg)"/>
  <circle cx="60" cy="40" r="70" fill="#ffd28a" opacity=".45"/>
  <circle cx="420" cy="150" r="90" fill="#ffc98f" opacity=".45"/>
  <circle cx="300" cy="20" r="40" fill="#fff" opacity=".5"/>

  <!-- kertas soal -->
  <g transform="rotate(-10 90 92)">
    <rect x="48" y="38" width="86" height="108" rx="10" fill="#c7d2fe" opacity=".6" transform="translate(5 6)"/>
    <rect x="48" y="38" width="86" height="108" rx="10" fill="url(#paper)" stroke="#c7d2fe" stroke-width="2"/>
    <text x="91" y="70" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#3b82f6">1+2</text>
    <circle cx="62" cy="90" r="5" fill="#22c55e"/><rect x="72" y="86" width="48" height="8" rx="4" fill="#cbd5e1"/>
    <circle cx="62" cy="108" r="5" fill="#22c55e"/><rect x="72" y="104" width="40" height="8" rx="4" fill="#cbd5e1"/>
    <circle cx="62" cy="126" r="5" fill="#cbd5e1"/><rect x="72" y="122" width="44" height="8" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- kado -->
  <ellipse cx="232" cy="160" rx="78" ry="10" fill="#e8a45c" opacity=".35"/>
  <rect x="172" y="82" width="120" height="76" rx="10" fill="url(#box)"/>
  <rect x="162" y="64" width="140" height="28" rx="9" fill="url(#lid)"/>
  <rect x="220" y="64" width="24" height="94" fill="url(#ribbon)"/>
  <path d="M232 64 C206 30 176 40 186 58 C192 68 214 66 232 64 Z" fill="#fb7185" stroke="#e11d48" stroke-width="3"/>
  <path d="M232 64 C258 30 288 40 278 58 C272 68 250 66 232 64 Z" fill="#fb7185" stroke="#e11d48" stroke-width="3"/>
  <circle cx="232" cy="62" r="9" fill="#e11d48"/>
  <rect x="180" y="96" width="14" height="44" rx="7" fill="#fff" opacity=".25"/>

  <!-- label GRATIS -->
  <g transform="rotate(12 360 70)">
    <path d="M318 46 h96 a10 10 0 0 1 10 10 v32 a10 10 0 0 1 -10 10 h-96 l-18 -26 z" fill="url(#tag)"/>
    <circle cx="316" cy="72" r="5" fill="#fff4d6"/>
    <text x="370" y="80" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" fill="#fff">GRATIS</text>
  </g>

  <!-- kilau -->
  <g fill="#facc15">
    <path d="M150 26 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M330 128 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M420 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
